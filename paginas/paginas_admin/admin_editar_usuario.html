<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Usuario | Neon Fox Gaming</title>
        <link rel="stylesheet" href="../../estilos/admin_style.css">
        <link rel="icon" href="../../imag../../es/favicon.webp">
    </head>
    <body style="background-color: #110027; color: #fafafa;">
        <header id="header">
            <div class="header-content">
                <h1>Neon fox gaming</h1>
                <p>Panel de Administrador</p>
            </div>
        </header>
        <section>
            <div class="menu">
                <hr>
                <a href="../../paginas/paginas_admin/admin_dashboard.html">DashBoard</a>
                <a href="../../paginas/paginas_admin/admin_productos.html">Productos</a>
                <a href="../../paginas/paginas_admin/admin_usuarios.html">Usuarios</a>
                <div class="menu-secundario">
                    <a href="../../paginas/paginas_admin/admin_configuracion.html">Configuracion</a>
                    <a href="../../paginas/paginas_admin/admin_perfil.html">Perfil</a>
                    <a href="../../paginas/paginas_admin/admin_ayuda.html">Ayuda</a>
                    <hr>
                    <a href="../../paginas/paginas_admin/admin_perfiles.html">Perfiles</a>
                </div>
            </div>
            <section class="contenido">
                <div class="titulo-pagina">
                    <div>
                        <p class="saludo">Usuarios</p>
                        <h1>Editar usuario</h1>
                    </div>
                    <a class="boton secundario" href="../../paginas/paginas_admin/admin_usuarios.html">Volver</a>
                </div>
                <form id="formulario-editar-usuario" class="formulario">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" type="text" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="correo">Correo</label>
                        <input id="correo" type="email" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="rol">Rol</label>
                        <select id="rol" required>
                            <option selected>Administrador</option>
                            <option>Cliente</option>
                        </select>
                    </div>
                    <div class="grupo-formulario">
                        <label for="estado">Estado</label>
                        <select id="estado">
                            <option selected>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>
                    <button class="boton" type="submit">Guardar cambios</button>
                </form>
            </section>
        </section>
        <script src="../../scripts/editarUsuarioScript.js"></script>
    </body>
</html>
