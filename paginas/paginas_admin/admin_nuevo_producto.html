<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nuevo Producto | Neon Fox Gaming</title>
        <link rel="stylesheet" href="../../estilos/admin_style.css">
        <link rel="icon" href="../../images/favicon.webp">
    </head>
    <body style="background-color: #110027; color: #fafafa;">
        <header id="header">
            <div class="header-content">
                <h1>Neon fox gaming</h1>
                <p>Panel de Administrador</p>
            </div>
        </header>
        <section>
            <div class="menu">
                <hr>
                <a href="../../paginas/paginas_admin/admin_dashboard.html">DashBoard</a>
                <a href="../../paginas/paginas_admin/admin_productos.html">Productos</a>
                <a href="../../paginas/paginas_admin/admin_usuarios.html">Usuarios</a>
                <div class="menu-secundario">
                    <a href="../../paginas/paginas_admin/admin_configuracion.html">Configuracion</a>
                    <a href="../../paginas/paginas_admin/admin_perfil.html">Perfil</a>
                    <a href="../../paginas/paginas_admin/admin_ayuda.html">Ayuda</a>
                    <hr>
                    <a href="../../paginas/paginas_admin/admin_perfiles.html">Perfiles</a>
                </div>
            </div>

            <section class="contenido">
                <div class="titulo-pagina">
                    <div>
                        <p class="saludo">Productos</p>
                        <h1>Nuevo producto</h1>
                    </div>
                    <a class="boton secundario" href="../../paginas/paginas_admin/admin_productos.html">Volver</a>
                </div>
                <form id="formulario-producto" class="formulario">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre del producto</label>
                        <input id="nombre" type="text" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <option>Periféricos</option>
                            <option>Monitores</option>
                            <option>Audio</option>
                        </select>
                    </div>
                    <div class="grupo-formulario">
                        <label for="precio">Precio</label>
                        <input id="precio" type="number" min="0" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="stock">Stock</label>
                        <input id="stock" type="number" min="0" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion">
                        </textarea>
                    </div>
                    <button class="boton" type="button" onclick="guardar()">Guardar producto</button>
                </form>
            </section>
        </section>
        <script src="../../scripts/guardarProductoScript.js"></script>
    </body>
</html>
